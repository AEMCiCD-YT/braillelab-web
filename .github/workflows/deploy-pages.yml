name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          # Served from its own domain (public/CNAME), so there is no base path.
          NEXT_PUBLIC_SITE_URL: https://braillelab.org
          # Public API of AEMCiCD Platform (repository variable). Empty = the page shows "not connected"
          # and keeps the contribution form closed; it never invents figures or transfer instructions.
          NEXT_PUBLIC_PLATFORM_API_URL: ${{ vars.PLATFORM_API_URL }}
          # Microsoft Forms registration link (repository variable). Empty = no "Inscribir equipo" button;
          # when set, the button shows only during the registration window (content/site.js).
          NEXT_PUBLIC_BRAILLETECH_REGISTRATION_URL: ${{ vars.BRAILLETECH_REGISTRATION_URL }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
